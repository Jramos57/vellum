name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run Tests
        run: swift test -v

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: apt-get update && apt-get install -y zip unzip

      - name: Swift Version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run Tests
        run: swift test -v

  build-apple-platforms:
    name: Build for Apple platforms
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Device builds, including 32-bit watchOS (arm64_32), where Int is
      # 32 bits wide: the macOS and Linux test jobs can't catch overflow there.
      - name: Build for watchOS, iOS, tvOS and visionOS
        run: |
          for platform in watchOS iOS tvOS visionOS; do
            echo "::group::$platform"
            xcodebuild -scheme vellum -destination "generic/platform=$platform" build
            echo "::endgroup::"
          done
